// blossom: the Fabric mod that embeds blossom-core.
// It does not depend on carpet in any way, neither at compile time nor at run time.
plugins {
	id 'net.fabricmc.fabric-loom'
}

loom {
	accessWidenerPath = file('src/main/resources/blossom.accesswidener')
}

base {
	archivesName = 'blossomscript'
}

version = project.mod_version
group = 'com.gnottero.blossom'

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// the language, unchanged and with no Minecraft inside
	implementation project(':blossom-core')
	include project(':blossom-core')
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// the dev server reads from gradle's stdin, so its console can be driven
tasks.matching { it.name == 'runServer' }.configureEach {
	standardInput = System.in
}
