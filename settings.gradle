pluginManagement {
    repositories {
        maven { // il maven di Fabric, per Loom
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'blossom'

// the language core: pure java, no dependency on Minecraft
include 'blossom-core'
// the Fabric mod that runs it
include 'blossom'
