// blossom-core: the language interpreter, pure java.
// No dependency on Minecraft, Fabric or the rest of carpet: it has to compile and be testable with
// the JVM alone, without downloading the game.
plugins {
	id 'java-library'
}

group = 'blossom'
version = project.mod_version

repositories {
	mavenCentral()
}

dependencies {
	api 'org.jspecify:jspecify:1.0.0'
	api 'com.google.code.gson:gson:2.11.0'
	api 'org.apache.commons:commons-lang3:3.17.0'
	implementation 'org.slf4j:slf4j-api:2.0.16'
	implementation 'it.unimi.dsi:fastutil:8.5.15'

	testImplementation platform('org.junit:junit-bom:5.11.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
		showStackTraces = true
	}
}

// reference benchmark of phase 1: ./gradlew :blossom-core:benchmark
tasks.register('benchmark', JavaExec) {
	group = 'verification'
	description = 'Baseline micro-benchmark of the interpreter (arithmetic loop and function calls)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'blossom.CoreBenchmark'
}
